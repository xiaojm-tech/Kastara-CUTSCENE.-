# KASTARA-CUTSCENE v1.0.0
# The plugin creates a separate cinematic world and builds its own ruined kingdom there.
cinematic-world:
  name: kastara_cinematic

settings:
  first-join-only: true
  start-delay-ticks: 40
  lock-player: true
  finish-gamemode: SURVIVAL
  camera-entity-name: "KASTARA_CAMERA"
  audio:
    enabled: true
    sound: "kastara:intro"
    category: MASTER
    volume: 1.0
    pitch: 1.0
  finish:
    title: "&6&lWELCOME TO KASTARA"
    subtitle: "&7The fate of this world now lies in your hands."
    title-fade-in: 10
    title-stay: 70
    title-fade-out: 20
    sound: "block.beacon.activate"
    particles:
      enabled: true
      count: 100
      radius: 2.0

spawn:
  world: world
  x: 0.5
  y: 80.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

# Timeline is measured from cutscene start in seconds.
# The camera moves smoothly between these points.
camera:
  interpolation: smooth
  waypoints:
    - time: 0
      world: world
      x: -24.0
      y: 105.0
      z: -24.0
      yaw: 45.0
      pitch: 12.0
    - time: 7
      world: world
      x: -12.0
      y: 92.0
      z: -12.0
      yaw: 45.0
      pitch: 18.0
    - time: 13
      world: world
      x: -5.0
      y: 84.0
      z: -5.0
      yaw: 35.0
      pitch: 8.0
    - time: 20
      world: world
      x: 0.5
      y: 82.0
      z: 0.5
      yaw: 180.0
      pitch: 15.0
    - time: 28
      world: world
      x: 5.0
      y: 88.0
      z: 5.0
      yaw: 225.0
      pitch: 10.0
    - time: 36
      world: world
      x: 3.0
      y: 84.0
      z: 3.0
      yaw: 180.0
      pitch: 20.0
    - time: 45
      world: world
      x: 0.5
      y: 82.0
      z: 0.5
      yaw: 180.0
      pitch: 5.0

scenes:
  - time: 0
    title: "&6&lKASTARA"
    subtitle: "&fLong ago, Kastara was a grand kingdom standing beneath the glory of its kings."
  - time: 4
    title: "&4&lTHE GREAT CALAMITY"
    subtitle: "&fYet a catastrophe brought everything to an end."
  - time: 7
    title: "&5&lTHE LAST WIZARD"
    subtitle: "&fOn the brink of ruin, a legendary mage cast their final spell."
  - time: 11
    title: "&d&lTHE SUMMONING"
    subtitle: "&fThey summoned souls from another world to come to Kastara."
  - time: 15
    title: "&f&lTHE CHOSEN"
    subtitle: "&fNow, you are one of them."
  - time: 17
    title: "&6&lKASTARA"
    subtitle: "&fKastara has been waiting for you."
  - time: 19
    title: "&6&lYOUR DESTINY"
    subtitle: "&fThe fate of this world now lies in your hands."

effects:
  summoning:
    enabled: true
    start-time: 11
    end-time: 22.5
    particle: PORTAL
    count-per-tick: 8
    sound: "block.beacon.ambient"
  arrival:
    enabled: true
    particle: END_ROD
    count: 100
    sound: "entity.enderman.teleport"

messages:
  no-player: "&cPlayer tidak ditemukan atau sedang offline."
  started: "&aCutscene KASTARA dimulai untuk &e%player%&a."
  stopped: "&eCutscene KASTARA dihentikan untuk &f%player%&e."
  skipped: "&aIntro berhasil dilewati."
  reloaded: "&aKonfigurasi KASTARA-CUTSCENE dimuat ulang."
  only-player: "&cPerintah ini hanya bisa digunakan oleh player."
  no-permission: "&cKamu tidak punya izin."
  usage: "&eGunakan: /kastaracutscene <play|stop|reload> [player]"
